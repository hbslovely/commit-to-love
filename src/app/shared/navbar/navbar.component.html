<!-- Modern Flat Navigation -->
<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <!-- Brand Logo -->
    <div class="navbar-brand">
      <a routerLink="/chao-mung" class="brand-link" title="Kỷ Niệm Yêu Thương">
        <div class="brand-avatar">
          <img src="assets/images/anh-chu-dao/avatar-couple.png" alt="P&Q" />
        </div>
        <div class="brand-content">
          <h1 class="brand-title">P&Q</h1>
          <span class="brand-subtitle">Love Story</span>
        </div>
      </a>
    </div>

    <!-- Desktop Navigation Menu -->
    <div class="navbar-menu">
      <ul class="nav-list">
        <li class="nav-item" *ngFor="let item of menuItems; trackBy: trackByFn">
          <a [routerLink]="item.link"
             routerLinkActive="active"
             class="nav-link"
             [title]="item.description">
            <i [class]="item.icon" class="nav-icon"></i>
            <span class="nav-label">{{ getShortText(item.text) }}</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-toggle" 
            (click)="toggleMobileMenu()" 
            [class.active]="isMobileMenuOpen"
            aria-label="Toggle menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</nav>

<!-- Mobile Navigation Overlay -->
<div class="mobile-overlay" 
     [class.active]="isMobileMenuOpen" 
     (click)="closeMobileMenu()">
</div>

<!-- Mobile Navigation Menu -->
<div class="mobile-menu" [class.active]="isMobileMenuOpen">
  <!-- Mobile Header -->
  <div class="mobile-header">
    <div class="mobile-brand">
      <div class="mobile-avatar">
        <img src="assets/images/anh-chu-dao/avatar-couple.png" alt="P&Q" />
      </div>
      <div class="mobile-brand-info">
        <h2 class="mobile-title">P&Q Love Story</h2>
        <p class="mobile-tagline">Kỷ Niệm Yêu Thương</p>
      </div>
    </div>
    <button class="mobile-close" (click)="closeMobileMenu()" aria-label="Close menu">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Mobile Menu Items -->
  <div class="mobile-nav-content">
    <ul class="mobile-nav-list">
      <li class="mobile-nav-item" *ngFor="let item of menuItems; trackBy: trackByFn">
        <a [routerLink]="item.link"
           routerLinkActive="active"
           class="mobile-nav-link"
           [title]="item.description"
           (click)="closeMobileMenu()">
          <div class="mobile-nav-icon">
            <i [class]="item.icon"></i>
          </div>
          <div class="mobile-nav-content-text">
            <span class="mobile-nav-title">{{ item.text }}</span>
            <small class="mobile-nav-desc">{{ item.description }}</small>
          </div>
          <i class="pi pi-chevron-right mobile-nav-arrow"></i>
        </a>
      </li>
    </ul>

    <!-- Mobile Footer -->
    <div class="mobile-footer">
      <div class="mobile-stats">
        <div class="stat-item">
          <span class="stat-number">1,247</span>
          <span class="stat-label">Kỷ Niệm</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">89</span>
          <span class="stat-label">Địa Điểm</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">2,095</span>
          <span class="stat-label">Ngày Yêu</span>
        </div>
      </div>
      <p class="mobile-copyright">© 2025 P&Q Love Story</p>
    </div>
  </div>
</div>
