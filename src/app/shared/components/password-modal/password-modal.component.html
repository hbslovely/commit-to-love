<div class="password-modal-overlay" *ngIf="isVisible" (click)="onBackdropClick($event)">
  <div class="password-modal">
    <div class="modal-header">
      <h3>Album Được Bảo Vệ</h3>
      <button class="close-btn" (click)="onClose()" type="button">
        <i class="pi pi-times"></i>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="album-info">
        <i class="pi pi-lock lock-icon"></i>
        <p class="album-title">{{ albumTitle }}</p>
        <p class="description">Album này được bảo vệ bằng mật khẩu. Vui lòng nhập mật khẩu để xem nội dung.</p>
      </div>
      
      <form (ngSubmit)="onSubmit()" class="password-form">
        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <input 
            type="password" 
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Nhập mật khẩu..."
            class="password-input"
            [class.error]="errorMessage"
            (input)="clearError()"
            [disabled]="isLoading"
            autocomplete="off"
          />
        </div>
        
        <div class="error-message" *ngIf="errorMessage">
          <i class="pi pi-exclamation-triangle"></i>
          {{ errorMessage }}
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isLoading">
            Hủy
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading || !password.trim()">
            <span *ngIf="isLoading" class="loading-spinner">
              <i class="pi pi-spin pi-spinner"></i>
            </span>
            <span *ngIf="!isLoading">Mở Album</span>
            <span *ngIf="isLoading">Đang xử lý...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
