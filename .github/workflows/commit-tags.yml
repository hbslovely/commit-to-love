# Each push to default branch or release/* branch: commit package.json -rc version,
# then tag v<version>.
#
# The next RC is computed from the PARENT commit's package.json version — never from
# HEAD's. This makes any manual version bump in a pushed commit a no-op: the workflow
# always reverts to the auto-computed RC derived from the prior released version, so
# humans cannot move the version off the branch's Y.M series by editing package.json.
#
# Skips chore(release) commits to avoid infinite loops.

name: Commit RC version

on:
  push:
    branches: [main, master, 'release/*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-rc-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rc:
    name: Commit version then tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Compute next RC version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(jq -r '.version' package.json)"

          # Base the next RC on the PARENT commit's version, not HEAD's.
          # If a pushed commit manually bumped package.json, we ignore it and
          # recompute from the last legitimately-released version (HEAD~1).
          # Falls back to CURRENT only when there is no parent (initial commit).
          BASE="${CURRENT}"
          if PARENT_VERSION="$(git show 'HEAD~1:package.json' 2>/dev/null | jq -r '.version // empty' 2>/dev/null)" && [ -n "${PARENT_VERSION}" ]; then
            BASE="${PARENT_VERSION}"
            if [ "${PARENT_VERSION}" != "${CURRENT}" ]; then
              echo "::notice::Manual version bump ignored (HEAD=${CURRENT}, parent=${PARENT_VERSION}). Reverting to RC derived from ${PARENT_VERSION}."
            fi
          fi

          PACKAGE_VERSION="$(node .github/scripts/release-version.mjs next-rc "${BASE}")"
          RELEASE_TAG="v${PACKAGE_VERSION}"

          if [ "${PACKAGE_VERSION}" = "${CURRENT}" ]; then
            echo "Version unchanged (${CURRENT}) — skipping."
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_bump=true" >> "${GITHUB_OUTPUT}"
          echo "previous_version=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Commit package.json version
        if: steps.version.outputs.should_bump == 'true'
        run: |
          .github/scripts/commit-package-version.sh \
            "${{ steps.version.outputs.package_version }}" \
            "chore(release): set version to ${{ steps.version.outputs.package_version }}" \
            "${{ github.ref_name }}"

      - name: Push release tag
        if: steps.version.outputs.should_bump == 'true'
        run: |
          .github/scripts/push-release-tag.sh \
            "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.version.outputs.package_version }}" \
            "RC ${{ steps.version.outputs.release_tag }} (was ${{ steps.version.outputs.previous_version }})"
